<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Persona Card Game — Unofficial Fan Game</title>
    <meta
      name="description"
      content="Unofficial fan-made browser card game inspired by the mechanics of the Persona series. Placeholder art only."
    />
    <!--
      Original placeholder mark (public/favicon.svg): an arcana card and a star,
      drawn from primitives. No official artwork, logo or symbol is used.
      The SVG is the real icon; the PNG is the fallback for browsers that will
      not take one, and theme.js keeps theme-color in step with the chosen deck.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1b1526" />
    <meta name="color-scheme" content="dark" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
