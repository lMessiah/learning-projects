#
# nginx site for persona.shcherbakov.co — the static game plus the match relay.
#
#   sudo cp deploy/nginx-persona.conf /etc/nginx/sites-available/persona
#   sudo ln -sf /etc/nginx/sites-available/persona /etc/nginx/sites-enabled/persona
#   sudo nginx -t && sudo systemctl reload nginx
#
# This REPLACES the existing four-line persona site. Everything it did (serve
# /var/www/persona on port 80) it still does; the additions are the /ws proxy,
# a rate limit in front of it, and cache headers for the hashed asset files.
#

# --- http-level directives -------------------------------------------------
# These sit outside the server block on purpose: sites-enabled is included
# inside nginx's http { } context, so this is where they belong.
#
# If `nginx -t` complains that "connection_upgrade" is a duplicate, another site
# on this machine already defines it — delete the map below and keep theirs.

# Rewrites the hop-by-hop Connection header only for requests that are actually
# asking to upgrade. Without it, a proxied WebSocket handshake fails with a 400.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Two brakes on the relay, both keyed to the client address:
#   - new connections per minute, which is what an abuser would flood;
#   - simultaneous open sockets, which is what would exhaust the room table.
# A real player opens a handful of sockets a session, so these are generous.
#
# Reconnection budget: a player on a bad connection re-dials on a backoff that
# settles at one attempt every 5s, so a full 90-second reconnect window costs
# roughly 20 connections — inside the 30/min sustained rate, with the burst
# absorbing the fast early retries. A refused attempt is not fatal either: the
# transport simply tries again on its next backoff step.
limit_req_zone  $binary_remote_addr zone=persona_ws_req:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=persona_ws_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name persona.shcherbakov.co;

    root /var/www/persona;
    index index.html;

    access_log /var/log/nginx/persona.access.log;
    error_log  /var/log/nginx/persona.error.log;

    # --- the relay ---------------------------------------------------------
    # Everything under /ws goes to the Node process: the socket upgrade itself
    # and the /ws/health probe the game uses to decide whether to offer links.
    location /ws {
        proxy_pass http://127.0.0.1:8788;

        # The four lines that make a WebSocket work through a proxy. HTTP/1.1 is
        # required — the default 1.0 cannot upgrade at all.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A match socket is idle whenever nobody is moving, and nginx's default
        # 60s read timeout would cut it mid-turn. The relay pings every 5s and
        # the players heartbeat every 3s, so a dead connection is noticed in
        # seconds regardless of how long this timeout is.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        limit_req  zone=persona_ws_req burst=10 nodelay;
        limit_conn persona_ws_conn 8;
    }

    # --- the game ----------------------------------------------------------
    # Vite writes content-hashed filenames into /assets, so they can be cached
    # hard: a change produces a new name rather than a stale file.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html must NOT be cached, or a deploy leaves browsers loading the
    # previous build's asset names.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
